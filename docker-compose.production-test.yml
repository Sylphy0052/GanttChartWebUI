# ====================
# GanttChart WebUI - Production Test Configuration
# ====================
# ローカル環境での本番設定テスト用

version: '3.8'

services:
  # ====================
  # PostgreSQL Database - Production Optimized
  # ====================
  postgres:
    image: postgres:15-alpine
    container_name: gantt_postgres_prod_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      POSTGRES_MAX_CONNECTIONS: 200
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
    volumes:
      - postgres_prod_test_data:/var/lib/postgresql/data:Z
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - gantt-prod-test-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ====================
  # Backend API - Production Optimized
  # ====================
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.backend.production
      args:
        NODE_ENV: production
    container_name: gantt_backend_prod_test
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      PORT: ${BACKEND_PORT}
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_SIZE:-2048}"
      AUTH_TYPE: ${AUTH_TYPE}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads_prod_test_data:/app/uploads:rw,Z
      - logs_prod_test_data:/app/logs:rw,Z
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gantt-prod-test-network
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.3'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ====================
  # Frontend - Production Optimized
  # ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/Dockerfile.frontend.production
      args:
        NODE_ENV: production
    container_name: gantt_frontend_prod_test
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: "--max-old-space-size=1024"
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    networks:
      - gantt-prod-test-network
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ====================
  # Nginx Reverse Proxy - Production Optimized
  # ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: gantt_nginx_prod_test
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs_prod_test:/var/log/nginx:rw
      - nginx_cache_prod_test:/var/cache/nginx:rw
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 100m
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - gantt-prod-test-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

# ====================
# Volumes - Test Data Persistence
# ====================
volumes:
  postgres_prod_test_data:
    driver: local
  uploads_prod_test_data:
    driver: local
  logs_prod_test_data:
    driver: local
  nginx_logs_prod_test:
    driver: local
  nginx_cache_prod_test:
    driver: local

# ====================
# Networks - Test Security
# ====================
networks:
  gantt-prod-test-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1