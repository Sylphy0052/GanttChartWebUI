#!/bin/bash
# バックアップ設定ファイル
# GanttChart WebUI Backup Configuration

# ===========================================
# 基本設定
# ===========================================

# バックアップ保存先ディレクトリ
BACKUP_DIR="/var/backups/ganttchart"
BACKUP_LOCAL_DIR="./backups"

# バックアップファイル命名規則
BACKUP_TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
BACKUP_DATE=$(date +"%Y%m%d")

# ===========================================
# データベース設定
# ===========================================

# PostgreSQL接続情報（Docker環境）
DB_CONTAINER_NAME="postgres"
DB_HOST="postgres"
DB_PORT="5432"
DB_NAME="gantt_db"
DB_USER="gantt_user"
DB_PASSWORD="gantt_password"

# バックアップ形式設定
DB_BACKUP_FORMAT="custom"  # custom, plain, tar, directory
DB_BACKUP_COMPRESS="true"
DB_BACKUP_ENCODING="UTF8"

# ===========================================
# ファイルバックアップ設定
# ===========================================

# バックアップ対象ディレクトリ
UPLOADS_DIR="../uploads"
LOGS_DIR="../logs"
CONFIG_DIR="../backend"
FRONTEND_CONFIG_DIR="../frontend"

# 除外パターン
EXCLUDE_PATTERNS=(
    "*.tmp"
    "*.log"
    "**/node_modules/**"
    "**/dist/**"
    "**/build/**"
    "**/.git/**"
    "**/coverage/**"
)

# ===========================================
# 圧縮・暗号化設定
# ===========================================

# 圧縮設定
COMPRESSION_ENABLED="true"
COMPRESSION_LEVEL="6"  # 1-9 (高いほど高圧縮)
COMPRESSION_FORMAT="gz"  # gz, xz, bzip2

# 暗号化設定（オプション）
ENCRYPTION_ENABLED="false"
ENCRYPTION_KEY_FILE="$HOME/.gnupg/backup-key.gpg"
ENCRYPTION_RECIPIENT="backup@ganttchart.local"

# ===========================================
# 保存ポリシー設定
# ===========================================

# 保持期間（日数）
KEEP_DAILY=30      # 日次バックアップ30日間
KEEP_WEEKLY=84     # 週次バックアップ12週間（84日）
KEEP_MONTHLY=365   # 月次バックアップ12ヶ月（365日）
KEEP_YEARLY=1825   # 年次バックアップ5年間（1825日）

# バックアップ種別の判定
BACKUP_TYPE="daily"
if [ "$(date +%u)" = "7" ]; then
    BACKUP_TYPE="weekly"
fi
if [ "$(date +%d)" = "01" ]; then
    BACKUP_TYPE="monthly"
fi
if [ "$(date +%m%d)" = "0101" ]; then
    BACKUP_TYPE="yearly"
fi

# ===========================================
# 通知設定
# ===========================================

# ログ設定
LOG_ENABLED="true"
LOG_LEVEL="INFO"  # DEBUG, INFO, WARN, ERROR
LOG_FILE="/var/log/ganttchart-backup.log"
LOG_MAX_SIZE="10M"
LOG_ROTATE_COUNT=5

# メール通知設定（オプション）
EMAIL_ENABLED="false"
EMAIL_TO="admin@ganttchart.local"
EMAIL_FROM="backup@ganttchart.local"
EMAIL_SUBJECT="GanttChart Backup Status"

# Slack通知設定（オプション）
SLACK_ENABLED="false"
SLACK_WEBHOOK_URL=""
SLACK_CHANNEL="#ganttchart-alerts"

# ===========================================
# パフォーマンス設定
# ===========================================

# 並列処理設定
PARALLEL_JOBS=2
MAX_BACKUP_TIME=1800  # 30分（秒）

# ネットワーク設定
RSYNC_BANDWIDTH_LIMIT="1000"  # KB/s
NETWORK_TIMEOUT=300  # 5分（秒）

# ===========================================
# セキュリティ設定
# ===========================================

# ファイル権限
BACKUP_FILE_PERMISSIONS="600"
BACKUP_DIR_PERMISSIONS="700"

# 一時ファイル設定
TEMP_DIR="/tmp/ganttchart-backup"
SECURE_DELETE="true"  # 一時ファイルの安全削除

# ===========================================
# 外部ストレージ設定（オプション）
# ===========================================

# AWS S3設定
S3_ENABLED="false"
S3_BUCKET="ganttchart-backups"
S3_REGION="ap-northeast-1"
S3_STORAGE_CLASS="STANDARD_IA"

# Google Cloud Storage設定
GCS_ENABLED="false"
GCS_BUCKET="ganttchart-backups"
GCS_STORAGE_CLASS="NEARLINE"

# FTP設定
FTP_ENABLED="false"
FTP_HOST=""
FTP_USER=""
FTP_PASSWORD=""
FTP_REMOTE_DIR="/backups/ganttchart"

# ===========================================
# 検証設定
# ===========================================

# バックアップ検証
VERIFY_BACKUP="true"
VERIFY_DATABASE="true"
VERIFY_FILES="true"
VERIFY_INTEGRITY="true"

# チェックサム設定
CHECKSUM_ALGORITHM="sha256"  # md5, sha1, sha256, sha512
CHECKSUM_FILE_ENABLED="true"

# ===========================================
# Docker環境設定
# ===========================================

# Docker Compose設定
DOCKER_COMPOSE_FILE="../infra/docker-compose.yml"
DOCKER_COMPOSE_PROJECT="ganttchart"

# コンテナ名設定
POSTGRES_CONTAINER="infra_postgres_1"
BACKEND_CONTAINER="infra_backend_1"
FRONTEND_CONTAINER="infra_frontend_1"

# ネットワーク設定
DOCKER_NETWORK="infra_gantt-network"

# ===========================================
# 開発・テスト設定
# ===========================================

# デバッグモード
DEBUG_MODE="false"
VERBOSE_OUTPUT="false"

# テストモード（実際のバックアップを実行しない）
TEST_MODE="false"
DRY_RUN="false"

# ===========================================
# バージョン情報
# ===========================================

BACKUP_SCRIPT_VERSION="1.0.0"
CONFIG_VERSION="1.0.0"
SUPPORTED_DB_VERSIONS=("13" "14" "15")