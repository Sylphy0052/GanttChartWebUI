services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gantt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (Development Mode)
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend.dev
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      PORT: 3002
      FRONTEND_URL: http://frontend:3000
    volumes:
      - ../backend:/app
      - /app/node_modules
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    ports:
      - "3012:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gantt-network
    command: >
      sh -c "
        chown -R node:node /app &&
        su node -c 'npx prisma migrate deploy' &&
        su node -c 'npm run start:dev'
      "

  # Frontend (Development Mode)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost
      NEXT_PUBLIC_BACKEND_URL: http://localhost
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3011:3000"
    networks:
      - gantt-network
    depends_on:
      - backend
    command: >
      sh -c "
        chown -R node:node /app &&
        su node -c 'npm run dev'
      "

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gantt-network

volumes:
  db_data:

networks:
  gantt-network:
    driver: bridge