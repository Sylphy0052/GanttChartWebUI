# ====================
# PostgreSQL 15 - Production Configuration
# ====================
# GanttChart WebUI向け最適化設定
# メモリ2GB、CPU2コア想定

# ====================
# Connection Settings
# ====================
max_connections = 200                   # 同時接続数上限
shared_buffers = 256MB                  # 共有バッファ（メモリの1/4程度）
effective_cache_size = 1GB              # OS有効キャッシュサイズ
work_mem = 4MB                          # ソート・ハッシュ操作用メモリ
maintenance_work_mem = 64MB             # VACUUM、CREATE INDEX用メモリ

# ====================
# Write Ahead Logging (WAL)
# ====================
wal_buffers = 16MB                      # WALバッファサイズ
checkpoint_completion_target = 0.9      # チェックポイント分散
max_wal_size = 1GB                      # WAL最大サイズ
min_wal_size = 80MB                     # WAL最小サイズ

# ====================
# Query Planner
# ====================
random_page_cost = 1.1                  # SSD想定の設定
effective_io_concurrency = 200          # SSD並行I/O数

# ====================
# Logging Configuration
# ====================
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000       # 1秒以上のクエリをログ
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ====================
# Statistics
# ====================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# ====================
# Autovacuum
# ====================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# ====================
# Client Connection Defaults
# ====================
timezone = 'Asia/Tokyo'
default_text_search_config = 'pg_catalog.english'