# ====================
# GanttChart WebUI - Production Nginx Configuration
# ====================
# セキュリティ、パフォーマンス、監視を重視した本番環境設定
# initial_render_ms_p95: 1500ms, drag_latency_ms_p95: 100ms 目標

# セキュリティ設定を読み込み
include /etc/nginx/security.conf;

# ====================
# Core Configuration
# ====================
user nginx;
worker_processes auto;  # CPUコア数に自動調整
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker設定最適化
worker_rlimit_nofile 65535;

events {
    # 接続数最適化
    worker_connections 4096;
    use epoll;  # Linux最適化
    multi_accept on;
    accept_mutex off;
}

http {
    # ====================
    # Basic Settings
    # ====================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # パフォーマンス最適化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;  # セキュリティ: Nginxバージョン非表示

    # ファイルサイズ制限（セキュリティ強化）
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # タイムアウト設定（DDoS対策）
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ====================
    # Gzip Compression
    # ====================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rdf+xml
        image/svg+xml;

    # ====================
    # Caching Configuration
    # ====================
    proxy_cache_path /var/cache/nginx 
                     levels=1:2 
                     keys_zone=app_cache:100m 
                     max_size=1g 
                     inactive=60m 
                     use_temp_path=off;

    # ====================
    # Logging Configuration (Enhanced)
    # ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format cache '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" cs=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    # セキュリティログ（security.confから）
    access_log /var/log/nginx/security.log security;

    # ====================
    # Upstream Configuration
    # ====================
    upstream backend {
        # バックエンドサーバー（負荷分散対応）
        server backend:3002 max_fails=3 fail_timeout=30s;
        # 追加サーバー例（スケールアウト時）
        # server backend2:3002 max_fails=3 fail_timeout=30s;
        
        # 接続プール最適化
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream frontend {
        # フロントエンドサーバー
        server frontend:3000 max_fails=3 fail_timeout=30s;
        
        # 接続プール最適化
        keepalive 16;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # ====================
    # HTTP Server (HTTPS Redirect Enabled)
    # ====================
    server {
        listen 80;
        server_name _;  # 本番では実際のドメイン名に変更

        # HTTP → HTTPS リダイレクト（本番環境では有効化）
        if ($https_redirect) {
            return 301 https://$server_name$request_uri;
        }

        # ====================
        # Security Headers (Enhanced)
        # ====================
        # セキュリティヘッダーの適用
        more_set_headers $enhanced_security_headers;

        # 悪意のあるユーザーエージェントのブロック
        if ($blocked_agent) {
            return 403 "Access Denied: Malicious User Agent";
        }

        # ====================
        # Health Check (認証不要)
        # ====================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ====================
        # Let's Encrypt ACME Challenge
        # ====================
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # ====================
        # Static Asset Optimization
        # ====================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|eot|svg)$ {
            proxy_pass http://frontend;
            proxy_cache app_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
            
            # ブラウザキャッシュ
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # セキュリティヘッダー
            more_set_headers $enhanced_security_headers;
        }

        # ====================
        # API Routing - 高優先度（セキュリティ強化）
        # ====================
        location ~ ^/(projects|issues|comments|images|uploads|backup|settings|changelog|dependencies|health)($|/) {
            # セキュリティチェック適用
            try_files $uri @api_security;
        }

        location @api_security {
            # API セキュリティ設定の適用
            if ($blocked_agent) {
                return 403 "Access Denied: Malicious User Agent";
            }
            
            # 厳格なレート制限
            limit_req zone=api_strict burst=30 nodelay;
            limit_req zone=ddos_protection burst=100 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # キープアライブ設定
            proxy_set_header Connection "";
            
            # タイムアウト設定
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # バッファ設定
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # セキュリティヘッダー
            more_set_headers $enhanced_security_headers;
        }

        # ====================
        # Authentication Endpoints (Strict Rate Limiting)
        # ====================
        location ~ ^/(auth|projects/.*/auth)($|/) {
            # 認証試行制限
            limit_req zone=auth_limit burst=3 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # セキュリティヘッダー
            more_set_headers $enhanced_security_headers;
        }

        # ====================
        # Upload Endpoints (Special Handling)
        # ====================
        location ~ ^/(uploads|images)($|/) {
            # アップロード制限
            limit_req zone=upload_limit burst=5 nodelay;
            
            # ファイルサイズ制限
            client_max_body_size 10M;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # アップロード専用タイムアウト
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # セキュリティヘッダー
            more_set_headers $enhanced_security_headers;
        }

        # ====================
        # WebSocket Routing (Socket.IO) - セキュリティ強化
        # ====================
        location /socket.io/ {
            # WebSocket セキュリティチェック
            try_files $uri @websocket_security;
        }

        location @websocket_security {
            # WebSocket接続制限
            limit_conn ws_conn_limit 10;
            
            # Origin チェック（本番環境では厳格化）
            set $allowed_origin 0;
            if ($http_origin ~ "^https?://(localhost|127\.0\.0\.1|your-domain\.com)(:[0-9]+)?$") {
                set $allowed_origin 1;
            }
            if ($allowed_origin = 0) {
                return 403 "Invalid Origin";
            }
            
            proxy_pass http://backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket専用タイムアウト
            proxy_connect_timeout 7s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # バッファ無効化（リアルタイム性重視）
            proxy_buffering off;
            
            # セキュリティヘッダー
            more_set_headers $enhanced_security_headers;
        }

        # ====================
        # Frontend Routing - 最低優先度
        # ====================
        location / {
            # 一般レート制限
            limit_req zone=general_limit burst=20 nodelay;
            
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Next.js特有の設定
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # セキュリティヘッダー
            more_set_headers $enhanced_security_headers;
        }
    }

    # ====================
    # HTTPS Server (SSL証明書設定後に有効化)
    # ====================
    server {
        listen 443 ssl http2;
        server_name your-domain.com;  # 実際のドメイン名に変更

        # SSL Certificate
        ssl_certificate /etc/ssl/certs/your-domain.crt;
        ssl_certificate_key /etc/ssl/private/your-domain.key;

        # セキュリティ設定（security.confから適用）
        # - ssl_protocols, ssl_ciphers, ssl_session_cache など

        # HSTS Header（強制）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # セキュリティヘッダーの適用
        more_set_headers $enhanced_security_headers;

        # 上記のHTTPサーバーのlocationブロックをここにコピー
        # （HTTPからHTTPS移行時に有効化）
    }

    # ====================
    # Status & Monitoring Page
    # ====================
    server {
        listen 8080;
        server_name localhost;
        access_log off;

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.20.0.0/16;  # Docker network
            deny all;
        }

        location /health {
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }
}