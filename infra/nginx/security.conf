# ====================
# GanttChart WebUI - Security Configuration
# ====================
# OWASP Top 10対応、PCI DSS準拠レベルのセキュリティ設定
# Version: 1.0.0

# ====================
# Rate Limiting Zones (Enhanced)
# ====================
# API レート制限（1000 req/min = 16.67 req/s）
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=16r/s;
# ログイン試行制限（強化）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# WebSocket接続制限（IP単位）
limit_conn_zone $binary_remote_addr zone=ws_conn_limit:10m;
# アップロード制限
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
# DDoS対策（バースト制限）
limit_req_zone $binary_remote_addr zone=ddos_protection:10m rate=50r/s;

# ====================
# Security Headers Map (Enhanced)
# ====================
map $sent_http_content_type $enhanced_security_headers {
    # HTML レスポンス用の厳格なセキュリティヘッダー
    ~^text/html$ "
        add_header X-Frame-Options 'DENY' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-XSS-Protection '1; mode=block' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header Permissions-Policy 'geolocation=(), microphone=(), camera=()' always;
        add_header Content-Security-Policy 'default-src \'self\'; script-src \'self\' \'unsafe-inline\' \'unsafe-eval\' \'strict-dynamic\'; style-src \'self\' \'unsafe-inline\'; img-src \'self\' data: https:; font-src \'self\' data:; connect-src \'self\' ws: wss:; frame-ancestors \'none\'; base-uri \'self\'; form-action \'self\'; upgrade-insecure-requests;' always;
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
    ";
    
    # API レスポンス用のセキュリティヘッダー
    ~^application/(json|javascript)$ "
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
    ";
    
    # その他のコンテンツタイプ
    default "
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
    ";
}

# ====================
# HTTPS Enforcement Map
# ====================
map $scheme $https_redirect {
    default 0;
    http 1;
}

# ====================
# Blocked User Agents (Security)
# ====================
map $http_user_agent $blocked_agent {
    default 0;
    ~*malicious 1;
    ~*bot 0;  # 正当なボットは許可
    ~*crawler 0;
    ~*(sqlmap|nmap|masscan|zap) 1;
    "" 1;  # 空のUser-Agentをブロック
}

# ====================
# SSL/TLS Configuration (Production Ready)
# ====================
# TLS 1.2+ のみ許可（PCI DSS準拠）
ssl_protocols TLSv1.2 TLSv1.3;

# 強固な暗号スイート（OWASP推奨）
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# サーバー暗号スイート優先
ssl_prefer_server_ciphers off;

# SSL セッション設定
ssl_session_cache shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling（SSL証明書検証の高速化）
ssl_stapling on;
ssl_stapling_verify on;

# ====================
# Security Locations (Reusable)
# ====================

# 悪意のあるユーザーエージェントのブロック
location @block_malicious {
    if ($blocked_agent) {
        return 403 "Access Denied";
    }
}

# 認証が必要なエンドポイントのレート制限
location @auth_rate_limit {
    limit_req zone=auth_limit burst=3 nodelay;
    limit_req_status 429;
    error_page 429 /rate-limit-exceeded.html;
}

# API専用のレート制限とセキュリティ
location @api_security {
    # 悪意のあるエージェントをブロック
    if ($blocked_agent) {
        return 403 "Access Denied: Malicious User Agent";
    }
    
    # 厳格なレート制限
    limit_req zone=api_strict burst=30 nodelay;
    limit_req zone=ddos_protection burst=100 nodelay;
    
    # セキュリティヘッダー適用
    more_set_headers $enhanced_security_headers;
    
    # リクエストサイズ制限
    client_max_body_size 10M;
    client_body_buffer_size 128k;
}

# WebSocket専用のセキュリティ設定
location @websocket_security {
    # 接続数制限
    limit_conn ws_conn_limit 10;
    limit_conn_status 429;
    
    # Origin チェック（開発環境では緩和）
    if ($http_origin !~ "^https?://(localhost|127\.0\.0\.1|your-domain\.com)(:[0-9]+)?$") {
        return 403 "Invalid Origin";
    }
    
    # セキュリティヘッダー適用
    more_set_headers $enhanced_security_headers;
}

# ====================
# Security Response Pages
# ====================

# レート制限エラーページ
error_page 429 @rate_limit_error;
location @rate_limit_error {
    internal;
    default_type application/json;
    return 429 '{"error":"Rate limit exceeded","retry_after":60}';
}

# セキュリティエラーページ
error_page 403 @security_error;
location @security_error {
    internal;
    default_type application/json;
    return 403 '{"error":"Access denied for security reasons"}';
}

# ====================
# Security Logging
# ====================
log_format security '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for" '
                    'rt=$request_time '
                    'blocked_agent=$blocked_agent '
                    'https_redirect=$https_redirect '
                    'rate_limited=$limit_req_status';

# ====================
# CSP Nonce Generation (for inline scripts)
# ====================
map $request_id $csp_nonce {
    ~^(.{8}) $1;
}