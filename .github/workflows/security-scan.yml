name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - dependencies
        - code
        - containers
        - licenses

env:
  NODE_VERSION: '20'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'dependencies' || github.event.inputs.scan_type == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies (Backend)
        working-directory: ./backend
        run: npm ci --only=production

      - name: Install Dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci --only=production

      - name: Run npm audit (Backend)
        working-directory: ./backend
        run: |
          echo "## Backend Dependency Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "### npm audit results:" >> $GITHUB_STEP_SUMMARY
          
          # Run audit and capture output
          if npm audit --audit-level moderate --json > audit-backend.json; then
            echo "✅ No moderate or higher vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
            npm audit --audit-level moderate
          fi
          
          # Check for critical/high vulnerabilities
          npm audit --audit-level high --json > audit-backend-critical.json || true
          CRITICAL_COUNT=$(cat audit-backend-critical.json | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH_COUNT=$(cat audit-backend-critical.json | jq -r '.metadata.vulnerabilities.high // 0')
          
          echo "- Critical vulnerabilities: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- High vulnerabilities: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Fail if critical vulnerabilities exist
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found. Failing the build."
            exit 1
          fi

      - name: Run npm audit (Frontend)
        working-directory: ./frontend
        run: |
          echo "## Frontend Dependency Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "### npm audit results:" >> $GITHUB_STEP_SUMMARY
          
          # Run audit and capture output
          if npm audit --audit-level moderate --json > audit-frontend.json; then
            echo "✅ No moderate or higher vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
            npm audit --audit-level moderate
          fi
          
          # Check for critical/high vulnerabilities
          npm audit --audit-level high --json > audit-frontend-critical.json || true
          CRITICAL_COUNT=$(cat audit-frontend-critical.json | jq -r '.metadata.vulnerabilities.critical // 0')
          HIGH_COUNT=$(cat audit-frontend-critical.json | jq -r '.metadata.vulnerabilities.high // 0')
          
          echo "- Critical vulnerabilities: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- High vulnerabilities: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Fail if critical vulnerabilities exist
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found. Failing the build."
            exit 1
          fi

      - name: Generate Dependency Report
        run: |
          mkdir -p security-reports
          
          # Combine audit results
          echo "# Dependency Security Report" > security-reports/dependency-report.md
          echo "Generated: $(date -u)" >> security-reports/dependency-report.md
          echo "" >> security-reports/dependency-report.md
          
          # Backend summary
          if [ -f backend/audit-backend-critical.json ]; then
            echo "## Backend Dependencies" >> security-reports/dependency-report.md
            echo "Critical: $(cat backend/audit-backend-critical.json | jq -r '.metadata.vulnerabilities.critical // 0')" >> security-reports/dependency-report.md
            echo "High: $(cat backend/audit-backend-critical.json | jq -r '.metadata.vulnerabilities.high // 0')" >> security-reports/dependency-report.md
            echo "Moderate: $(cat backend/audit-backend-critical.json | jq -r '.metadata.vulnerabilities.moderate // 0')" >> security-reports/dependency-report.md
            echo "" >> security-reports/dependency-report.md
          fi
          
          # Frontend summary
          if [ -f frontend/audit-frontend-critical.json ]; then
            echo "## Frontend Dependencies" >> security-reports/dependency-report.md
            echo "Critical: $(cat frontend/audit-frontend-critical.json | jq -r '.metadata.vulnerabilities.critical // 0')" >> security-reports/dependency-report.md
            echo "High: $(cat frontend/audit-frontend-critical.json | jq -r '.metadata.vulnerabilities.high // 0')" >> security-reports/dependency-report.md
            echo "Moderate: $(cat frontend/audit-frontend-critical.json | jq -r '.metadata.vulnerabilities.moderate // 0')" >> security-reports/dependency-report.md
          fi

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-report
          path: |
            security-reports/
            backend/audit-*.json
            frontend/audit-*.json
          retention-days: 30

  code-security-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'code' || github.event.inputs.scan_type == ''

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript, javascript
          queries: security-extended,security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build Applications
        run: |
          cd backend && npm run build
          cd ../frontend && npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:typescript"

      - name: Run ESLint Security Rules (Backend)
        working-directory: ./backend
        run: |
          # Install eslint-plugin-security if not already present
          npm install --no-save eslint-plugin-security
          
          # Run ESLint with security rules
          npx eslint . --ext .ts,.js --format json --output-file ../security-reports/eslint-backend.json || true
          
          # Generate human-readable report
          npx eslint . --ext .ts,.js --format html --output-file ../security-reports/eslint-backend.html || true

      - name: Run ESLint Security Rules (Frontend)
        working-directory: ./frontend
        run: |
          # Install eslint-plugin-security if not already present
          npm install --no-save eslint-plugin-security
          
          # Run ESLint with security rules
          npx eslint . --ext .ts,.tsx,.js,.jsx --format json --output-file ../security-reports/eslint-frontend.json || true
          
          # Generate human-readable report
          npx eslint . --ext .ts,.tsx,.js,.jsx --format html --output-file ../security-reports/eslint-frontend.html || true

      - name: Analyze Security Issues
        run: |
          mkdir -p security-reports
          
          echo "# Code Security Analysis Report" > security-reports/code-security-report.md
          echo "Generated: $(date -u)" >> security-reports/code-security-report.md
          echo "" >> security-reports/code-security-report.md
          
          # Count ESLint security issues
          if [ -f security-reports/eslint-backend.json ]; then
            BACKEND_ISSUES=$(cat security-reports/eslint-backend.json | jq '. | length')
            echo "## Backend ESLint Issues: $BACKEND_ISSUES" >> security-reports/code-security-report.md
          fi
          
          if [ -f security-reports/eslint-frontend.json ]; then
            FRONTEND_ISSUES=$(cat security-reports/eslint-frontend.json | jq '. | length')
            echo "## Frontend ESLint Issues: $FRONTEND_ISSUES" >> security-reports/code-security-report.md
          fi
          
          echo "" >> security-reports/code-security-report.md
          echo "See uploaded artifacts for detailed analysis results." >> security-reports/code-security-report.md

      - name: Upload Code Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: code-security-report
          path: security-reports/
          retention-days: 30

  container-security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'containers' || github.event.inputs.scan_type == ''

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: |
          # Build production images for scanning
          docker build -f infra/Dockerfile.backend.production -t gantt-backend:security-scan ./backend
          docker build -f infra/Dockerfile.frontend.production -t gantt-frontend:security-scan ./frontend

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gantt-backend:security-scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gantt-frontend:security-scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      - name: Generate Trivy JSON Reports
        run: |
          mkdir -p security-reports
          
          # Backend container scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/workspace aquasec/trivy image \
            --format json --output /workspace/security-reports/trivy-backend.json \
            gantt-backend:security-scan
            
          # Frontend container scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd):/workspace aquasec/trivy image \
            --format json --output /workspace/security-reports/trivy-frontend.json \
            gantt-frontend:security-scan

      - name: Analyze Container Security Results
        run: |
          echo "# Container Security Scan Report" > security-reports/container-security-report.md
          echo "Generated: $(date -u)" >> security-reports/container-security-report.md
          echo "" >> security-reports/container-security-report.md
          
          # Backend analysis
          if [ -f security-reports/trivy-backend.json ]; then
            CRITICAL=$(cat security-reports/trivy-backend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
            HIGH=$(cat security-reports/trivy-backend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length')
            MEDIUM=$(cat security-reports/trivy-backend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length')
            
            echo "## Backend Container Vulnerabilities" >> security-reports/container-security-report.md
            echo "- Critical: $CRITICAL" >> security-reports/container-security-report.md
            echo "- High: $HIGH" >> security-reports/container-security-report.md
            echo "- Medium: $MEDIUM" >> security-reports/container-security-report.md
            echo "" >> security-reports/container-security-report.md
            
            # Fail if critical vulnerabilities found
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Critical vulnerabilities found in backend container"
              exit 1
            fi
          fi
          
          # Frontend analysis
          if [ -f security-reports/trivy-frontend.json ]; then
            CRITICAL=$(cat security-reports/trivy-frontend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
            HIGH=$(cat security-reports/trivy-frontend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length')
            MEDIUM=$(cat security-reports/trivy-frontend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length')
            
            echo "## Frontend Container Vulnerabilities" >> security-reports/container-security-report.md
            echo "- Critical: $CRITICAL" >> security-reports/container-security-report.md
            echo "- High: $HIGH" >> security-reports/container-security-report.md
            echo "- Medium: $MEDIUM" >> security-reports/container-security-report.md
            
            # Fail if critical vulnerabilities found
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Critical vulnerabilities found in frontend container"
              exit 1
            fi
          fi

      - name: Upload Container Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: container-security-report
          path: |
            security-reports/
            trivy-*.sarif
          retention-days: 30

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'licenses' || github.event.inputs.scan_type == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check Backend Licenses
        working-directory: ./backend
        run: |
          mkdir -p ../security-reports
          
          echo "## Backend License Report" > ../security-reports/license-report.md
          echo "Generated: $(date -u)" >> ../security-reports/license-report.md
          echo "" >> ../security-reports/license-report.md
          
          # Generate license report
          license-checker --json --out ../security-reports/backend-licenses.json
          license-checker --csv --out ../security-reports/backend-licenses.csv
          
          # Check for prohibited licenses
          PROHIBITED_LICENSES="GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0"
          
          if license-checker --failOn "$PROHIBITED_LICENSES" --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense" 2>/dev/null; then
            echo "✅ Backend: No prohibited licenses found" >> ../security-reports/license-report.md
          else
            echo "⚠️ Backend: Prohibited or unallowed licenses detected" >> ../security-reports/license-report.md
            license-checker --failOn "$PROHIBITED_LICENSES" || true
          fi

      - name: Check Frontend Licenses
        working-directory: ./frontend
        run: |
          echo "" >> ../security-reports/license-report.md
          echo "## Frontend License Report" >> ../security-reports/license-report.md
          
          # Generate license report
          license-checker --json --out ../security-reports/frontend-licenses.json
          license-checker --csv --out ../security-reports/frontend-licenses.csv
          
          # Check for prohibited licenses
          PROHIBITED_LICENSES="GPL-2.0,GPL-3.0,AGPL-1.0,AGPL-3.0"
          
          if license-checker --failOn "$PROHIBITED_LICENSES" --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense" 2>/dev/null; then
            echo "✅ Frontend: No prohibited licenses found" >> ../security-reports/license-report.md
          else
            echo "⚠️ Frontend: Prohibited or unallowed licenses detected" >> ../security-reports/license-report.md
            license-checker --failOn "$PROHIBITED_LICENSES" || true
          fi

      - name: Generate License Summary
        run: |
          echo "" >> security-reports/license-report.md
          echo "## License Summary" >> security-reports/license-report.md
          
          # Count unique licenses
          BACKEND_LICENSES=$(cat security-reports/backend-licenses.json | jq -r 'keys[]' | cut -d@ -f1 | sort -u | wc -l)
          FRONTEND_LICENSES=$(cat security-reports/frontend-licenses.json | jq -r 'keys[]' | cut -d@ -f1 | sort -u | wc -l)
          
          echo "- Backend packages: $BACKEND_LICENSES" >> security-reports/license-report.md
          echo "- Frontend packages: $FRONTEND_LICENSES" >> security-reports/license-report.md
          
          # Generate combined license list
          echo "" >> security-reports/license-report.md
          echo "## All Detected Licenses" >> security-reports/license-report.md
          
          cat security-reports/backend-licenses.json security-reports/frontend-licenses.json | \
            jq -r '.[].licenses' | sort -u | \
            sed 's/^/- /' >> security-reports/license-report.md

      - name: Upload License Reports
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-report
          path: security-reports/
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-scan, container-security-scan, license-compliance]
    if: always()

    steps:
      - name: Download All Security Reports
        uses: actions/download-artifact@v4
        with:
          path: all-security-reports/

      - name: Generate Security Summary
        run: |
          mkdir -p security-summary
          
          echo "# Security Scan Summary Report" > security-summary/SECURITY_SUMMARY.md
          echo "Generated: $(date -u)" >> security-summary/SECURITY_SUMMARY.md
          echo "Commit: ${{ github.sha }}" >> security-summary/SECURITY_SUMMARY.md
          echo "Branch: ${{ github.ref_name }}" >> security-summary/SECURITY_SUMMARY.md
          echo "" >> security-summary/SECURITY_SUMMARY.md
          
          # Job status summary
          echo "## Scan Results Overview" >> security-summary/SECURITY_SUMMARY.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> security-summary/SECURITY_SUMMARY.md
          echo "- Code Security: ${{ needs.code-security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> security-summary/SECURITY_SUMMARY.md
          echo "- Container Security: ${{ needs.container-security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> security-summary/SECURITY_SUMMARY.md
          echo "- License Compliance: ${{ needs.license-compliance.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> security-summary/SECURITY_SUMMARY.md
          echo "" >> security-summary/SECURITY_SUMMARY.md
          
          # Aggregate findings from downloaded reports
          echo "## Detailed Findings" >> security-summary/SECURITY_SUMMARY.md
          
          # Look for dependency report
          if [ -d all-security-reports/dependency-security-report ]; then
            echo "### Dependency Vulnerabilities" >> security-summary/SECURITY_SUMMARY.md
            if [ -f all-security-reports/dependency-security-report/dependency-report.md ]; then
              cat all-security-reports/dependency-security-report/dependency-report.md >> security-summary/SECURITY_SUMMARY.md
            fi
            echo "" >> security-summary/SECURITY_SUMMARY.md
          fi
          
          # Look for container report
          if [ -d all-security-reports/container-security-report ]; then
            echo "### Container Vulnerabilities" >> security-summary/SECURITY_SUMMARY.md
            if [ -f all-security-reports/container-security-report/container-security-report.md ]; then
              cat all-security-reports/container-security-report/container-security-report.md >> security-summary/SECURITY_SUMMARY.md
            fi
            echo "" >> security-summary/SECURITY_SUMMARY.md
          fi
          
          # Look for license report
          if [ -d all-security-reports/license-compliance-report ]; then
            echo "### License Compliance" >> security-summary/SECURITY_SUMMARY.md
            if [ -f all-security-reports/license-compliance-report/license-report.md ]; then
              cat all-security-reports/license-compliance-report/license-report.md >> security-summary/SECURITY_SUMMARY.md
            fi
          fi

      - name: Upload Security Summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary-report
          path: security-summary/
          retention-days: 90

      - name: Comment Security Results on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            
            let securityComment = '## 🔒 Security Scan Results\n\n';
            
            // Build status table
            securityComment += '| Scan Type | Status | Details |\n';
            securityComment += '|-----------|--------|----------|\n';
            securityComment += `| Dependencies | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | Vulnerability scan |\n`;
            securityComment += `| Code Analysis | ${{ needs.code-security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | CodeQL + ESLint security |\n`;
            securityComment += `| Containers | ${{ needs.container-security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | Trivy image scan |\n`;
            securityComment += `| Licenses | ${{ needs.license-compliance.result == 'success' && '✅ Passed' || '❌ Failed' }} | License compliance |\n`;
            securityComment += '\n';
            
            // Overall status
            const allPassed = '${{ needs.dependency-scan.result }}' === 'success' && 
                             '${{ needs.code-security-scan.result }}' === 'success' && 
                             '${{ needs.container-security-scan.result }}' === 'success' && 
                             '${{ needs.license-compliance.result }}' === 'success';
                             
            if (allPassed) {
              securityComment += '✅ **All security scans passed!** This PR is ready for security review.\n\n';
            } else {
              securityComment += '⚠️ **Some security scans failed.** Please review the failures before merging.\n\n';
            }
            
            securityComment += '📊 Detailed reports are available in the [workflow artifacts](';
            securityComment += `${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}).\n`;
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: securityComment
            });

  notify-security-issues:
    name: Notify Security Issues
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-security-scan, container-security-scan, license-compliance]
    if: |
      always() && (
        needs.dependency-scan.result == 'failure' ||
        needs.code-security-scan.result == 'failure' ||
        needs.container-security-scan.result == 'failure' ||
        needs.license-compliance.result == 'failure'
      )

    steps:
      - name: Send Security Alert
        if: secrets.SLACK_SECURITY_WEBHOOK_URL
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚨 Security Alert: GanttChart WebUI",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Dependency Scan",
                      "value": "${{ needs.dependency-scan.result }}",
                      "short": true
                    },
                    {
                      "title": "Code Security",
                      "value": "${{ needs.code-security-scan.result }}",
                      "short": true
                    },
                    {
                      "title": "Container Security",
                      "value": "${{ needs.container-security-scan.result }}",
                      "short": true
                    },
                    {
                      "title": "License Compliance",
                      "value": "${{ needs.license-compliance.result }}",
                      "short": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "button",
                      "text": "View Workflow",
                      "url": "${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}